# LSD_OS mkinitcpio configuration
# Otimizado para inicializacao rapida em HDs mecanicos

MODULES=()
BINARIES=()
FILES=()

# Hooks necessarios para boot com udev e dinit
HOOKS=(base udev autodetect microcode modconf kms keyboard consolefont block filesystems fsck)

# Compressao ZSTD ultrarrapida (-1):
# Reduz drasticamente o tempo que a CPU gasta descompactando o initramfs
# e mantem uma excelente taxa de descompressao em memoria durante o boot.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 -1)

MODULES_DECOMPRESS="no"
