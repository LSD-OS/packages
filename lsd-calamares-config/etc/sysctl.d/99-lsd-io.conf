# Otimizacoes de memoria e I/O para evitar travamentos em HDs mecanicos
# LSD_OS - Foco em responsividade de desktop e baixa latencia de disco

# Swappiness agressivo para ZRAM (compacta memoria em RAM antes de travar ou recorrer a disco)
vm.swappiness = 150

# Reduz pressao para descartar cache de arquivos e diretorios da RAM (evita releituras no HD)
vm.vfs_cache_pressure = 50

# Inicia gravacao assincrona em disco mais cedo para evitar grandes aculos que congelam a maquina
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Aumenta intervalo para flush de paginas sujas (reduz movimentacao continua do cabecote do HD)
vm.dirty_writeback_centisecs = 1500

# Torna o escalonador do kernel mais agressivo ao responder a eventos interativos
kernel.sched_latency_ns = 6000000
kernel.sched_migration_cost_ns = 500000
