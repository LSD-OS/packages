modules-search: [ local ]

instances:
- id:       offline
  module:   packages
  config:   packages_offline.conf
- id:       before
  module:   shellprocess
  config:   shellprocess-before.conf
- id:       sync-live
  module:   shellprocess
  config:   shellprocess-sync-live.conf
- id:       final
  module:   shellprocess
  config:   shellprocess-final.conf

sequence:
    - show:
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - shellprocess@before
        - shellprocess@sync-live
        - machineid
        - fstab
        - luksopenswaphookcfg
        - luksbootkeyfile
        - initcpiocfg
        - initcpio
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-artix
        - packages@offline
        - shellprocess@final
        - umount
    - show:
        - finished

branding: default

prompt-install: false

dont-chroot: false

disable-cancel: false

disable-cancel-during-exec: false
