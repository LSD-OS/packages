backend: pacman

skip_if_no_internet: false
update_db: false
update_system: false

pacman:
    num_retries: 3
    disable_download_timeout: false
    needed_only: true

operations:
  - try_remove:
    - calamares
    - calamares-extensions
    - lsd-welcome
    - mkinitcpio-archiso
    - squashfs-tools
    - lsd-calamares-config
