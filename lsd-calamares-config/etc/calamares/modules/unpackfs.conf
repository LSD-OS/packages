---
unpack:
  - source: "/run/archiso/bootmnt/lsdos/x86_64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: ""
  - source: "/run/archiso/bootmnt/lsdos/boot/x86_64/vmlinuz-linux"
    sourcefs: "file"
    destination: "/boot/vmlinuz-linux"
  - source: "/usr/bin/lsd-install-limine"
    sourcefs: "file"
    destination: "/usr/local/bin/lsd-install-limine"
