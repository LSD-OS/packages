i18n:
     name: "Finalizando configuração do LSD_OS"

dontChroot: false
timeout: 180
script:
    - "-/usr/bin/lsd-apply-package-selection"
    - "-rm -f /usr/bin/lsd-apply-package-selection"
    - "-rm -f /usr/bin/lsd-sync-live-to-target"
    - "-sh -c 'LANG_VAL=$(grep \"^LANG=\" /etc/locale.conf 2>/dev/null | cut -d= -f2); if [ -n \"$LANG_VAL\" ] && [ -f /etc/locale.gen ]; then sed -i \"s/^#[[:space:]]*\\(${LANG_VAL}.*\\)/\\1/\" /etc/locale.gen && locale-gen; fi'"
    - "-userdel -r liveuser"
    - "-sed -i '/liveuser/d' /etc/sudoers"
    - "-rm -f /etc/sudoers.d/liveuser"
    - "-rm -f /etc/sudoers.d/calamares"
    - "-rc-update del lsd-welcome default"
    - "-rm -f /etc/runlevels/default/lsd-welcome /etc/init.d/lsd-welcome"
    - "-rm -rf /etc/lsd-welcome"
    - "-sed -i '/lsd-welcome/d' /etc/init.d/cosmic-greeter"
    - "-sed -i '/lsd-welcome/d' /usr/bin/cosmic-greeter-start"
    - "-flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo"
    - "-/usr/bin/lsd-sync-autologin"
    - "-rm -f /usr/bin/lsd-sync-autologin"
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "-rm -rf /etc/initcpio/hooks/iso_loop_find /etc/initcpio/install/iso_loop_find"
    - "-rm -f /etc/xdg/autostart/calamares.desktop"
    - "-rm -f /etc/skel/.config/autostart/calamares.desktop"
    - "-rm -f /home/*/.config/autostart/calamares.desktop"
    - "-sh -c 'for udir in /home/*; do if [ -d \"$udir\" ] && [ -f /etc/skel/.config/cosmic/com.system76.CosmicTheme.Mode/v1/mode ]; then mkdir -p \"$udir/.config/cosmic/com.system76.CosmicTheme.Mode/v1\" && cp -f /etc/skel/.config/cosmic/com.system76.CosmicTheme.Mode/v1/mode \"$udir/.config/cosmic/com.system76.CosmicTheme.Mode/v1/mode\" && u=$(basename \"$udir\") && chown -R \"$u:$u\" \"$udir/.config/cosmic\"; fi; done'"
    - "-rm -f /usr/share/applications/lsd-calamares.desktop"
    - "-pacman -Rns --noconfirm lsd-calamares-config calamares-extensions calamares lsd-welcome mkinitcpio-archiso"
    - "-rm -rf /etc/calamares"
    - "-mkinitcpio -P"
    - "-chmod +x /usr/local/bin/lsd-install-limine"
    - "-/usr/local/bin/lsd-install-limine"
    - "-rm -f /usr/local/bin/lsd-install-limine"
