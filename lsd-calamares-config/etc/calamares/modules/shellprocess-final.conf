i18n:
     name: "Finalizando configuração do LSD_OS"

dontChroot: false
timeout: 180
script:
    - "-userdel -r liveuser"
    - "-sed -i '/liveuser/d' /etc/sudoers"
    - "-rm -f /etc/sudoers.d/liveuser"
    - "-rm -f /etc/sudoers.d/calamares"
    - "-rm -f /etc/dinit.d/boot.d/lsd-welcome"
    - "-rm -rf /etc/lsd-welcome"
    - "-sed -i '/lsd-welcome/d' /etc/dinit.d/cosmic-greeter"
    - "-sed -i '/lsd-welcome/d' /usr/bin/cosmic-greeter-start"
    - "-sed -i '/initial_session/,+3d' /etc/greetd/cosmic-greeter.toml"
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "-rm -rf /etc/initcpio/hooks/iso_loop_find /etc/initcpio/install/iso_loop_find"
    - "-rm -f /etc/xdg/autostart/calamares.desktop"
    - "-rm -f /etc/skel/.config/autostart/calamares.desktop"
    - "-rm -f /usr/share/applications/lsd-calamares.desktop"
    - "-mkinitcpio -P"
    - "-chmod +x /usr/local/bin/lsd-install-limine"
    - "-/usr/local/bin/lsd-install-limine"
    - "-rm -f /usr/local/bin/lsd-install-limine"
