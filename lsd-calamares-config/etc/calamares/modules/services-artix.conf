---
command: artix-service

services:
  - name: "dbus"
    action: "enable"
    mandatory: true

  - name: "elogind"
    action: "enable"
    mandatory: true

  - name: "NetworkManager"
    action: "enable"
    mandatory: true

  - name: "chrony"
    action: "enable"
    mandatory: false

  - name: "zram"
    action: "enable"
    mandatory: false

  - name: "cosmic-greeter"
    action: "enable"
    mandatory: false

  - name: "cosmic-greeter-daemon"
    action: "enable"
    mandatory: false

  - name: "lsd-welcome"
    action: "disable"
    mandatory: false
