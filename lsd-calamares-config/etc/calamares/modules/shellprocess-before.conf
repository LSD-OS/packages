i18n:
     name: "Preparando sistema para LSD_OS"

dontChroot: false
timeout: 60
script:
    - "-rm -f /etc/lsd-version"
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "-rm -rf /etc/initcpio/hooks/iso_loop_find /etc/initcpio/install/iso_loop_find"
    - "-rm -f /etc/dinit.d/early-root-rw.target /etc/dinit.d/fsck-root /etc/dinit.d/root-ro"
    - "-rm -f /etc/ssh/sshd_config.d/10-archiso.conf"
    - "-rm -f /etc/skel/.config/autostart/calamares.desktop"
    - "-rm -f /etc/xdg/autostart/calamares.desktop"
    - "-rm -f /usr/share/applications/lsd-calamares.desktop"
